<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Odhlášení – MMdata</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f8fc;
      color: #2c3e50;
      text-align: center;
      padding: 60px 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    .logo {
      margin-bottom: 30px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <a href="https://www.mmdata.cz" style="text-decoration:none;" aria-label="Domů – MMdata">
        <svg width="210" height="40" viewBox="0 0 210 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <title>Logo MM-Data</title>
          <rect x="4" y="21" width="8" height="14" rx="1" fill="#2c3e50"/>
          <rect x="14" y="7" width="8" height="28" rx="1" fill="#d4af37"/>
          <rect x="24" y="21" width="8" height="14" rx="1" fill="#2c3e50"/>
          <rect x="34" y="14" width="8" height="21" rx="1" fill="#2c3e50"/>
          <text x="50" y="32" font-family="Montserrat, sans-serif" font-size="28" font-weight="600" fill="#2c3e50">MM-DATA</text>
        </svg>
      </a>
    </div>
    <h1>Vaše odhlášení bylo zaznamenáno</h1>
    <p>
      Už vám nebudeme posílat žádné další zprávy.<br>
      Pokud jste tento e-mail obdrželi omylem, omlouváme se.<br>
      Děkujeme za váš čas a přejeme klidný den.
    </p>
  </div>
</body>
</html>
